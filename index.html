<!DOCTYPE html>

    <script>
      // Tailscale/LAN HTTP origins are not considered secure contexts by Chrome,
      // so crypto.randomUUID() is unavailable even though localhost works. Provide
      // a small RFC 4122 v4 fallback before the app modules load.
      if (window.crypto && typeof window.crypto.randomUUID !== 'function') {
        window.crypto.randomUUID = function randomUUIDFallback() {
          const bytes = new Uint8Array(16);
          window.crypto.getRandomValues(bytes);
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0'));
          return `${hex.slice(0, 4).join('')}-${hex.slice(4, 6).join('')}-${hex.slice(6, 8).join('')}-${hex.slice(8, 10).join('')}-${hex.slice(10, 16).join('')}`;
        };
      }
    </script>
