<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept C: Network-meets-dog — keeps the original node/line structure but eyes replace two nodes, nose is center -->
  <defs>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4A46A"/>
      <stop offset="100%" stop-color="#AF8D54"/>
    </linearGradient>
  </defs>

  <!-- Network lines (same as original) -->
  <line x1="50" y1="50" x2="28" y2="30" stroke="#AF8D54" stroke-width="1.5" opacity="0.3"/>
  <line x1="50" y1="50" x2="72" y2="30" stroke="#AF8D54" stroke-width="1.5" opacity="0.3"/>
  <line x1="50" y1="50" x2="50" y2="78" stroke="#AF8D54" stroke-width="1.5" opacity="0.3"/>

  <!-- Center hub = nose (same position, slightly oval) -->
  <ellipse cx="50" cy="50" rx="13" ry="11" fill="url(#gold3)"/>
  <!-- Nose detail — dark highlight -->
  <ellipse cx="50" cy="48.5" rx="5" ry="3" fill="#003462" opacity="0.2"/>
  <!-- Nostrils -->
  <circle cx="46.5" cy="49" r="1.5" fill="#003462" opacity="0.12"/>
  <circle cx="53.5" cy="49" r="1.5" fill="#003462" opacity="0.12"/>

  <!-- Eye nodes (replace upper orbiting circles) -->
  <!-- Left eye -->
  <circle cx="28" cy="30" r="8" fill="#AF8D54" opacity="0.5"/>
  <circle cx="28" cy="29" r="3.5" fill="#003462" opacity="0.4"/>
  <circle cx="29.5" cy="27.5" r="1" fill="white" opacity="0.45"/>
  <!-- Right eye -->
  <circle cx="72" cy="30" r="8" fill="#AF8D54" opacity="0.5"/>
  <circle cx="72" cy="29" r="3.5" fill="#003462" opacity="0.4"/>
  <circle cx="73.5" cy="27.5" r="1" fill="white" opacity="0.45"/>

  <!-- Bottom node = chin/mouth (subtle) -->
  <circle cx="50" cy="78" r="7" fill="#C4A46A" opacity="0.35"/>
  <!-- Smile -->
  <path d="M 46 77 Q 50 82 54 77" stroke="#AF8D54" stroke-width="1" fill="none" opacity="0.4"/>
</svg>