# Keep production-aligned values here because `supabase config push` reconciles
# the whole remote config, not just the setting being changed.
[api]
max_rows = 100000

[db.settings]
max_connections = 100

[storage]
file_size_limit = "500MiB"

[auth]
site_url = "https://k9operations.com"
additional_redirect_urls = ["https://k9operations.com/*"]
minimum_password_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[functions.performance-review-signing]
# The function validates the caller token in-function via Supabase Auth.
# Gateway verification can reject newer ES256 auth JWTs before function code runs.
verify_jwt = false

[functions.interview-ai-draft]
# The function forwards the caller token to Supabase queries so RLS remains authoritative.
# Gateway verification can reject newer ES256 auth JWTs before function code runs.
verify_jwt = false

[functions.ops-compute]
# Scheduled pg_net calls use the vault service key. The function validates that
# service key in-function so the gateway can accept non-JWT Supabase secret keys.
verify_jwt = false

[functions.gingr-boh-poll]
# Scheduled pg_net calls use the vault service key. The function validates that
# service key in-function so the gateway can accept non-JWT Supabase secret keys.
verify_jwt = false

[functions.gingr-sync]
# Checkout TV and scheduled pg_net calls invoke this function with Supabase
# publishable/service keys, not user JWTs. The function loads scoped Gingr
# credentials server-side and validates required parameters in-function.
verify_jwt = false
